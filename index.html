    <main class="contenedor">
        <h1>3 Datos importantes sobre Tortugas</h1>

        <button class="pregunta">Dónde viven las tortugas marinas?</button>
        <section class="respuesta">
            <p>Viven en los océanos de todo el mundo y solo salen a la playa a poner sus huevos.</p>
        </section>

        <button class="pregunta">Qué comen las tortugas terrestres?</button>
        <section class="respuesta">
            <p>Su dieta es herbívora, comen pasto, frutas, verduras y plantas.</p>
        </section>

        <button class="pregunta">Cuánto tiempo pueden vivir?</button>
        <section class="respuesta">
            <p>Depende de la especie, pero algunas pueden vivir más de 100 años.</p>
        </section>

    </main>
